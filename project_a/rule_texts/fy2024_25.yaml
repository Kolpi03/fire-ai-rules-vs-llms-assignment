  - passage_id: P24-ROUNDING
    clause: "Sections 288A and 288B"
    source_id: ITD-COMPUTATION-INDIVIDUAL
    topics: [rounding]
    kind: statutory_paraphrase
    text: >-
      288A: total income is rounded off to the nearest multiple of ten rupees (paise ignored; last figure five or more rounds up).
