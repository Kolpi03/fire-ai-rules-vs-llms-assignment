      For assessment year 2025-26: Total Income (Rs) Rate. Upto 3,00,000 Nil. From 3,00,001 to 7,00,000 5%.
      From 7,00,001 to 10,00,000 10%. From 10,00,001 to 12,00,000 15%. From 12,00,001 to 15,00,000 20%. Above 15,00,000 30%.
  - passage_id: P24-NEW-EXCLUSIONS
    clause: "Section 115BAC(2)"
    source_id: ITD-COMPUTATION-INDIVIDUAL
    topics: [new_regime, hra, 80c, 80d, 80ccd, home_loan, deduction]
    kind: verbatim
    text: >-
      Total income of the assessee has to be computed without claiming the following specified exemptions and deductions;
      House Rent Allowance [ Section 10(13A) ]; Professional Tax [ Section 16(iii) ]; Interest on housing loan (In case of
      property referred under section 23(2) i.e. self-occupied house property) [ Section 24(b) ]; Deduction under Sections
      80C to 80U other than specified under Section 80JJAA , Section 80CCD(2) , Section 80CCH(2) , and Section 80LA(1A) [Chapter VI-A].
      Total income of the assessee has to be computed without set-off of any loss under the head "Income from house property" with any other head of income.
  - passage_id: P24-STD-DED
