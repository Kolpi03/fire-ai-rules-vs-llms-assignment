# Official rule text for FY 2024-25 (AY 2025-26), salary-only scope.
# Each passage is a VERBATIM excerpt from the snapshot of the cited Income Tax Department page
# (project_a/rule_texts/_snapshots/<source_id>.txt), except: `summary_table` = an official table
# transcribed cell by cell; `verbatim_with_note` = verbatim text plus a bracketed explanatory note;
# `statutory_paraphrase` = provision paraphrased (the section text itself was not snapshotted).
# These passages are the ONLY legal text given to the LLM engines (query-time retrieval and the
# one-off rule compiler).
financial_year: "2024-25"
assessment_year: "2025-26"
passages:
  - passage_id: P24-OLD-SLABS
    clause: "First Schedule, Part III, Para A (old regime rates)"
    source_id: ITD-COMPUTATION-INDIVIDUAL
    topics: [slab, old_regime, senior, super_senior, age]
    kind: summary_table
    text: >-
      Normal Tax Rates (Old tax regime). Net income range | Resident Super Senior Citizen | Resident Senior Citizen | Any other Individual.
      Up to Rs. 2,50,000: Nil | Nil | Nil. Rs. 2,50,001- Rs. 3,00,000: Nil | Nil | 5%. Rs. 3,00,001- Rs. 5,00,000: Nil | 5% | 5%.
      Rs. 5,00,001- Rs. 10,00,000: 20% | 20% | 20%. Above Rs. 10,00,000: 30% | 30% | 30%.
      'Super senior citizen' means an individual whose age is 80 years or more at any time during the relevant previous year.
      'Senior citizen' means an individual whose age is 60 years or more at any time during the relevant previous year but less than 80 years on the last day of the previous year.
