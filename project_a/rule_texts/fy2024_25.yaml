  - passage_id: P24-80C
    clause: "Section 80C read with Section 80CCE"
    source_id: ITD-DEDUCTIONS-ALLOWABLE
    topics: [80c, deduction, old_regime, investment]
    kind: verbatim
    text: >-
      80C: Life insurance premium ... Contributions by an individual ... [and other specified investments].
      Notes: 1. Deduction is limited to whole of the amount paid or deposited subject to a maximum of Rs. 1,50,000.
      This maximum limit of Rs. 1,50,000 is the aggregate of the deduction that may be claimed under sections 80C, 80CCC and 80CCD.
      section 80CCE provides that the aggregate amount of deductions under section 80C, section 80CCC and section 80CCD(1) shall not,
      in any case, exceed Rs. 1,50,000.
  - passage_id: P24-80CCD1B
    clause: "Section 80CCD(1B)"
    source_id: ITD-80CCD
    topics: [80ccd, nps, deduction, old_regime]
    kind: verbatim
    text: >-
      (1B) An assessee referred to in sub-section (1), shall be allowed a deduction in computation of his total income, whether or not
      any deductions is allowed under sub-section (1), of the whole of the amount paid or deposited in the previous year in his account
      under a pension scheme notified or as may be notified by the Central Government, which shall not exceed fifty thousand rupees:
      Provided that no deduction under this sub-section shall be allowed in respect of the amount on which a deduction has been claimed
      and allowed under sub-section (1).
  - passage_id: P24-80D
    clause: "Section 80D(2), (2A), (2B), (4)"
    source_id: ITD-80D
    topics: [80d, health_insurance, medical, parents, senior, preventive, old_regime]
    kind: verbatim
    text: >-
      (2) Where the assessee is an individual, the sum referred to in sub-section (1) shall be the aggregate of the following, namely:—
      (a) the whole of the amount paid to effect or to keep in force an insurance on the health of the assessee or his family ... or any
      payment made on account of preventive health check-up of the assessee or his family as does not exceed in the aggregate
      twenty-five thousand rupees; and (b) the whole of the amount paid to effect or to keep in force an insurance on the health of the
      parent or parents of the assessee or any payment made on account of preventive health check-up of the parent or parents of the
      assessee as does not exceed in the aggregate twenty-five thousand rupees; (c) the whole of the amount paid on account of medical
      expenditure incurred on the health of the assessee or any member of his family as does not exceed in the aggregate fifty thousand
      rupees; and (d) the whole of the amount paid on account of medical expenditure incurred on the health of any parent of the assessee,
      as does not exceed in the aggregate fifty thousand rupees: Provided that the amount referred to in clause (c) or clause (d) is paid
      in respect of a senior citizen and no amount has been paid to effect or to keep in force an insurance on the health of such person:
      Provided further that the aggregate of the sum specified under clause (a) and clause (c) or the aggregate of the sum specified under
      clause (b) and clause (d) shall not exceed fifty thousand rupees. Explanation.—For the purposes of clause (a), "family" means the
      spouse and dependant children of the assessee. (2A) Where the amounts referred to in clauses (a) and (b) of sub-section (2) are paid
      on account of preventive health check-up, the deduction for such amounts shall be allowed to the extent it does not exceed in the
      aggregate five thousand rupees. (4) Where the sum specified in clause (a) or clause (b) of sub-section (2) ... is paid to effect or
      keep in force an insurance on the health of any person specified therein, and who is a senior citizen, the provisions of this section
      shall have effect as if for the words "twenty-five thousand rupees", the words "fifty thousand rupees" had been substituted.
  - passage_id: P24-87A
    clause: "Section 87A and first proviso (Finance Act 2023, w.e.f. 1-4-2024)"
    source_id: ITD-87A-FA2024-NO2
    topics: [rebate, 87a, old_regime, new_regime, marginal_relief, resident]
    kind: verbatim
    text: >-
      87A. An assessee, being an individual resident in India, whose total income does not exceed five hundred thousand rupees, shall be
      entitled to a deduction, from the amount of income-tax (as computed before allowing the deductions under this Chapter) on his total
      income with which he is chargeable for any assessment year, of an amount equal to hundred per cent of such income-tax or an amount of
      twelve thousand and five hundred rupees, whichever is less: Provided that where the total income of the assessee is chargeable to tax
      under sub-section (1A) of section 115BAC, and the total income— (a) does not exceed seven hundred thousand rupees, the assessee shall
      be entitled to a deduction from the amount of income-tax ... of an amount equal to one hundred per cent of such income-tax or an amount
      of twenty-five thousand rupees, whichever is less; (b) exceeds seven hundred thousand rupees and the income-tax payable on such total
      income exceeds the amount by which the total income is in excess of seven hundred thousand rupees, the assessee shall be entitled to a
      deduction from the amount of income-tax ... of an amount equal to the amount by which the income-tax payable on such total income is in
      excess of the amount by which the total income exceeds seven hundred thousand rupees.
