    kind: verbatim
    text: >-
      16(ia) Standard Deduction (a) In case of normal tax regime - Rs. 50,000 or the amount of salary, whichever is lower;
      (b) In case of new tax regime under section 115BAC (1A)(ii) - Up to Rs. 75,000 or the amount of salary, whichever is lower.
  - passage_id: P24-HRA
    clause: "Section 10(13A) read with Rule 2A"
    source_id: ITD-HRA-FAQ
    topics: [hra, rent, metro, salary, old_regime]
    kind: verbatim
    text: >-
      Least/minimum of the following is exempt (Not taxable/deducted from total HRA received) (a) Actual amount of HRA received
      (b) Rent paid Less 10% of salary (c) 50% of salary if rented accomandation is situated at Kolkata, Chennai, Mumbai and Delhi
      or 40 % of salary if the rented accomadation is situated at other than Kolkata, Chennai, Mumbai and Delhi.
      In case of no rent is paid then exemption will be zero.
      [Rule 2A: "salary" for this purpose means basic salary plus dearness allowance forming part of retirement benefits.]
